# Project-wide Gradle settings.
# IMPORTANT: This file should *NOT* be checked into Version Control Systems,
# as it contains information specific to your local configuration.

# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Configure Gradle to run tasks in parallel.
org.gradle.parallel=true

# Enable the Gradle build cache.
org.gradle.caching=true

# Enable configuration caching (experimental).
org.gradle.configuration-cache=true

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true

# Disable non-transitive R class for faster builds on AGP 8+.
android.nonFinalResIds=false
