name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: "android-34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Network diagnostics
        run: |
          echo "=== Testing connectivity (10s timeout each) ==="
          for url in \
            "https://services.gradle.org" \
            "https://dl.google.com" \
            "https://repo1.maven.org" \
            "https://plugins.gradle.org" \
            "https://maven.aliyun.com" \
            "https://mirrors.aliyun.com" \
            "https://mirrors.cloud.tencent.com" \
            "https://mirrors.huaweicloud.com"; do
            echo -n "$url → "
            code=$(curl -sI -m 10 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null)
            if [ $? -eq 0 ]; then
              echo "HTTP $code"
            else
              echo "UNREACHABLE"
            fi
          done

      - name: Install Gradle 8.7 + pre-download plugin artifacts + create init script
        run: |
          # ============================================================
          # 1. Install Gradle 8.7
          # ============================================================
          echo "=== Installing Gradle 8.7 ==="
          curl -fSL -o /tmp/gradle.zip \
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.7-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo mv /opt/gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

          # ============================================================
          # 2. Pre-download plugin artifacts to /tmp/local-maven
          #    No bash functions, no namerefs — just explicit curl.
          #    Try every mirror for each file, first success wins.
          # ============================================================
          LOCAL_MAVEN="/tmp/local-maven"
          mkdir -p "$LOCAL_MAVEN"

          # Helper: try downloading a single file from multiple mirrors
          # Usage: try_download <dest_path> <mirror1_url> <mirror2_url> ...
          try_download() {
            local dest="$1"
            shift
            mkdir -p "$(dirname "$dest")"
            for url in "$@"; do
              echo -n "    TRY: $(echo $url | sed 's|https://||;s|/.*||')... "
              if curl -sfSL -m 60 -o "$dest" "$url" 2>/dev/null; then
                local sz=$(wc -c < "$dest")
                if [ "$sz" -gt 0 ]; then
                  echo "OK (${sz} bytes)"
                  return 0
                fi
              fi
              rm -f "$dest"
              echo "FAIL"
            done
            echo "    ALL MIRRORS FAILED for $(basename "$dest")"
            return 0  # don't fail the step
          }

          echo ""
          echo "=== Pre-downloading AGP 8.5.2 ==="
          B="com/android/tools/build/gradle/8.5.2"
          try_download "$LOCAL_MAVEN/$B/gradle-8.5.2.pom" \
            "https://maven.aliyun.com/repository/google/$B/gradle-8.5.2.pom" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/gradle-8.5.2.pom" \
            "https://dl.google.com/dl/android/maven2/$B/gradle-8.5.2.pom"
          try_download "$LOCAL_MAVEN/$B/gradle-8.5.2.jar" \
            "https://maven.aliyun.com/repository/google/$B/gradle-8.5.2.jar" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/gradle-8.5.2.jar" \
            "https://dl.google.com/dl/android/maven2/$B/gradle-8.5.2.jar"

          echo ""
          echo "=== Pre-downloading Kotlin Gradle Plugin 1.9.24 ==="
          B="org/jetbrains/kotlin/kotlin-gradle-plugin/1.9.24"
          try_download "$LOCAL_MAVEN/$B/kotlin-gradle-plugin-1.9.24.pom" \
            "https://maven.aliyun.com/repository/central/$B/kotlin-gradle-plugin-1.9.24.pom" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/kotlin-gradle-plugin-1.9.24.pom" \
            "https://mirrors.huaweicloud.com/repository/maven/$B/kotlin-gradle-plugin-1.9.24.pom" \
            "https://repo1.maven.org/maven2/$B/kotlin-gradle-plugin-1.9.24.pom"
          try_download "$LOCAL_MAVEN/$B/kotlin-gradle-plugin-1.9.24.jar" \
            "https://maven.aliyun.com/repository/central/$B/kotlin-gradle-plugin-1.9.24.jar" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/kotlin-gradle-plugin-1.9.24.jar" \
            "https://mirrors.huaweicloud.com/repository/maven/$B/kotlin-gradle-plugin-1.9.24.jar" \
            "https://repo1.maven.org/maven2/$B/kotlin-gradle-plugin-1.9.24.jar"

          echo ""
          echo "=== Pre-downloading KSP 1.9.24-1.0.20 ==="
          B="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/1.9.24-1.0.20"
          try_download "$LOCAL_MAVEN/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.pom" \
            "https://maven.aliyun.com/repository/gradle-plugin/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.pom" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.pom" \
            "https://plugins.gradle.org/m2/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.pom"
          try_download "$LOCAL_MAVEN/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.jar" \
            "https://maven.aliyun.com/repository/gradle-plugin/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.jar" \
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.jar" \
            "https://plugins.gradle.org/m2/$B/com.google.devtools.ksp.gradle.plugin-1.9.24-1.0.20.jar"

          echo ""
          echo "=== Verifying downloaded files ==="
          find "$LOCAL_MAVEN" -type f \( -name "*.jar" -o -name "*.pom" \) -exec ls -la {} \;

          # ============================================================
          # 3. Create Gradle init script — runs BEFORE settings.gradle.kts.
          #    beforeSettings can modify pluginManagement.repositories,
          #    which allprojects/buildscript CANNOT do.
          # ============================================================
          echo ""
          echo "=== Creating Gradle init script ==="
          printf '%s\n' \
            "beforeSettings { settings ->" \
            "    settings.pluginManagement {" \
            "        repositories {" \
            "            maven { url = uri('/tmp/local-maven') }" \
            "            maven { url = uri('https://maven.aliyun.com/repository/google') }" \
            "            maven { url = uri('https://maven.aliyun.com/repository/central') }" \
            "            maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }" \
            "            maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }" \
            "            maven { url = uri('https://mirrors.huaweicloud.com/repository/maven/') }" \
            "            google()" \
            "            mavenCentral()" \
            "            gradlePluginPortal()" \
            "        }" \
            "    }" \
            "    settings.dependencyResolutionManagement {" \
            "        repositories {" \
            "            maven { url = uri('/tmp/local-maven') }" \
            "            maven { url = uri('https://maven.aliyun.com/repository/google') }" \
            "            maven { url = uri('https://maven.aliyun.com/repository/central') }" \
            "            maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }" \
            "            maven { url = uri('https://mirrors.huaweicloud.com/repository/maven/') }" \
            "            google()" \
            "            mavenCentral()" \
            "        }" \
            "    }" \
            "}" \
            > /tmp/init.gradle
          echo "Init script created at /tmp/init.gradle"
          cat /tmp/init.gradle

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleDebug -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 --init-script /tmp/init.gradle
          else
            gradle assembleDebug -PuseStubCore=false --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 --init-script /tmp/init.gradle
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleRelease -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 --init-script /tmp/init.gradle
          else
            gradle assembleRelease -PuseStubCore=false --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 --init-script /tmp/init.gradle
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ github.event.inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
