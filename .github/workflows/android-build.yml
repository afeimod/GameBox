name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: "android-34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7 from Aliyun mirror
        run: |
          # Download Gradle from Aliyun mirror (services.gradle.org is
          # unreachable on some runners, causing Connection refused).
          # We install Gradle system-wide and use it directly, bypassing
          # the wrapper's download logic entirely.
          GRADLE_VERSION="8.7"
          curl -fSL -o /tmp/gradle.zip \
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo mv "/opt/gradle-${GRADLE_VERSION}" /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleDebug -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace
          else
            gradle assembleDebug -PuseStubCore=false --no-daemon --stacktrace
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleRelease -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace
          else
            gradle assembleRelease -PuseStubCore=false --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ github.event.inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
