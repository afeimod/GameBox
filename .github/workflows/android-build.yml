name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: "android-34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed 2>/dev/null || true
          # 幂等安装：ubuntu-latest 自带 cmdline-tools / build-tools，但不一定带 NDK / cmake
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            > /dev/null 2>&1 || true
          # 显式导出 NDK 路径给 Gradle 用
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            ./gradlew assembleDebug -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            ./gradlew assembleRelease -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ github.event.inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
