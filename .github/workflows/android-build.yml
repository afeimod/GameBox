name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: "android-34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Network diagnostics
        run: |
          echo "=== Testing connectivity (10s timeout each) ==="
          for url in \
            "https://services.gradle.org" \
            "https://dl.google.com" \
            "https://repo1.maven.org" \
            "https://plugins.gradle.org" \
            "https://maven.aliyun.com" \
            "https://mirrors.aliyun.com" \
            "https://mirrors.cloud.tencent.com" \
            "https://mirrors.huaweicloud.com"; do
            echo -n "$url → "
            code=$(curl -sI -m 10 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null)
            if [ $? -eq 0 ]; then
              echo "HTTP $code"
            else
              echo "UNREACHABLE"
            fi
          done

      - name: Install Gradle 8.7 + pre-download all plugin artifacts
        run: |
          set -e

          # 1. Install Gradle from aliyun mirror (services.gradle.org unreachable)
          echo "=== Installing Gradle 8.7 ==="
          curl -fSL -o /tmp/gradle.zip \
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.7-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo mv /opt/gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

          # 2. Pre-download AGP + Kotlin + KSP to ~/.m2/repository (standard Maven local repo).
          #    Try multiple mirrors — whichever works, use it.
          M2_REPO="$HOME/.m2/repository"
          mkdir -p "$M2_REPO"

          # Define mirror base URLs for Maven Central content
          CENTRAL_MIRRORS=(
            "https://maven.aliyun.com/repository/central"
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public"
            "https://mirrors.huaweicloud.com/repository/maven"
            "https://repo1.maven.org/maven2"
          )
          # Define mirror base URLs for Google Maven content
          GOOGLE_MIRRORS=(
            "https://maven.aliyun.com/repository/google"
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public"
            "https://dl.google.com/dl/android/maven2"
          )
          # Define mirror base URLs for Gradle Plugin Portal content
          PLUGIN_MIRRORS=(
            "https://maven.aliyun.com/repository/gradle-plugin"
            "https://mirrors.cloud.tencent.com/nexus/repository/maven-public"
            "https://plugins.gradle.org/m2"
          )

          # download_artifact <mirror_urls_array_name> <group_path> <artifact> <version>
          download_artifact() {
            local -n mirrors=$1
            local group_path="$2"
            local artifact="$3"
            local version="$4"

            local dest="${M2_REPO}/${group_path}/${artifact}/${version}"
            mkdir -p "$dest"

            for ext in pom jar module; do
              local file="${artifact}-${version}.${ext}"
              local dest_file="${dest}/${file}"

              # Skip if already downloaded
              if [ -f "$dest_file" ] && [ -s "$dest_file" ]; then
                echo "  [SKIP] ${file} (already exists)"
                continue
              fi

              for mirror in "${mirrors[@]}"; do
                local url="${mirror}/${group_path}/${artifact}/${version}/${file}"
                echo -n "  [TRY] ${file} from ${mirror}... "
                if curl -sfSL -m 60 -o "$dest_file" "$url" 2>/dev/null; then
                  local size=$(wc -c < "$dest_file")
                  if [ "$size" -gt 0 ]; then
                    echo "OK (${size} bytes)"
                    break
                  fi
                fi
                rm -f "$dest_file"
                echo "FAIL"
              done

              if [ ! -f "$dest_file" ] || [ ! -s "$dest_file" ]; then
                echo "  [WARN] ${file} could not be downloaded from any mirror"
                rm -f "$dest_file"
              fi
            done
          }

          echo ""
          echo "=== Pre-downloading AGP 8.5.2 ==="
          download_artifact GOOGLE_MIRRORS "com/android/tools/build" "gradle" "8.5.2"

          echo ""
          echo "=== Pre-downloading Kotlin Gradle Plugin 1.9.24 ==="
          download_artifact CENTRAL_MIRRORS "org/jetbrains/kotlin" "kotlin-gradle-plugin" "1.9.24"

          echo ""
          echo "=== Pre-downloading KSP 1.9.24-1.0.20 ==="
          download_artifact PLUGIN_MIRRORS "com/google/devtools/ksp" "com.google.devtools.ksp.gradle.plugin" "1.9.24-1.0.20"

          echo ""
          echo "=== Maven local repo contents ==="
          find "$M2_REPO" -type f -name "*.jar" -o -name "*.pom" -o -name "*.module" | sort

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleDebug -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
          else
            gradle assembleDebug -PuseStubCore=false --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ github.event.inputs.abi_filter }}" ]; then
            gradle assembleRelease -PuseStubCore=false -PabiFilter="${{ github.event.inputs.abi_filter }}" --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
          else
            gradle assembleRelease -PuseStubCore=false --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ github.event.inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
