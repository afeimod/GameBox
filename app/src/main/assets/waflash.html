<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WAFlash Player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #canvas{display:block;width:100%;height:100%;background:#000;outline:none}
  #waflashStatus{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:70%;color:#fff;margin:0 auto;padding:20px;font-size:1rem;text-align:center;
    background-color:rgba(0,0,0,0.7);border-radius:8px;z-index:100;display:none}
  #switchBtn{margin-top:12px;padding:8px 20px;background:#8A7BFF;color:#fff;
    border:none;border-radius:4px;cursor:pointer;font-size:14px}
  #switchBtn:hover{background:#7A6BEF}
</style>
</head>
<body>
<canvas id="canvas" tabindex="1"></canvas>
<div id="waflashStatus">正在加载 WAFlash 引擎...</div>
<script>
// ---------------------------------------------------------------------------
// URL 参数解析
// ---------------------------------------------------------------------------
var params = new URLSearchParams(location.search);
var swfUrl = params.get('swf') || '';
var quality = params.get('quality') || 'high';
var autoplay = params.get('autoplay') || 'on';
var scale = params.get('scale') || 'showAll';

// ---------------------------------------------------------------------------
// 按键状态管理器（与 player.html 相同）
// ---------------------------------------------------------------------------
window.__gameKeys = (function(){
    var pressed = {};
    function dispatch(type, key, code, keyCode){
        try{
            var ev = new KeyboardEvent(type, {
                key:key, code:code, keyCode:keyCode, which:keyCode,
                bubbles:true, cancelable:true
            });
            document.dispatchEvent(ev);
            window.dispatchEvent(ev);
            if(document.activeElement && document.activeElement !== document.body){
                document.activeElement.dispatchEvent(ev);
            }
        }catch(e){}
    }
    return {
        down: function(keyCode, key, code){
            keyCode = parseInt(keyCode);
            if(pressed[keyCode]) return;
            pressed[keyCode] = {key:key, code:code};
            dispatch('keydown', key, code, keyCode);
        },
        up: function(keyCode, key, code){
            keyCode = parseInt(keyCode);
            if(!pressed[keyCode]) return;
            delete pressed[keyCode];
            dispatch('keyup', key, code, keyCode);
            setTimeout(function(){ dispatch('keyup', key, code, keyCode); }, 50);
            setTimeout(function(){ dispatch('keyup', key, code, keyCode); }, 150);
        },
        releaseAll: function(){
            for(var kc in pressed){
                var info = pressed[kc];
                dispatch('keyup', info.key, info.code, parseInt(kc));
                dispatch('keyup', info.key, info.code, parseInt(kc));
            }
            pressed = {};
        },
        sync: function(androidKeys){
            var androidSet = {};
            androidKeys.forEach(function(kc){ androidSet[kc] = true; });
            for(var kc in pressed){
                if(!androidSet[kc]){
                    var info = pressed[kc];
                    dispatch('keyup', info.key, info.code, parseInt(kc));
                    delete pressed[kc];
                }
            }
        }
    };
})();

window.addEventListener('blur', function(){ window.__gameKeys.releaseAll(); });
document.addEventListener('visibilitychange', function(){
    if(document.hidden) window.__gameKeys.releaseAll();
});

window.__setQuality = function(q){ /* WAFlash 不支持运行时切换画质 */ };

// ---------------------------------------------------------------------------
// WAFlash 引擎加载 — 使用 WAFlashFactory (Emscripten Module 模式)
// ---------------------------------------------------------------------------
var canvas = document.getElementById('canvas');
var statusEl = document.getElementById('waflashStatus');

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 显示状态信息
function setStatus(msg){
    if(msg){
        console.log('WAFLASH> ' + msg);
        statusEl.innerHTML = msg;
        statusEl.style.display = 'block';
    }
}

function showStatus(){ statusEl.style.display = 'block'; }
function hideStatus(){ statusEl.style.display = 'none'; }

// 加载 WAFlash 引擎脚本
var script = document.createElement('script');
script.src = 'waflash/waflash.min.js';
script.async = true;

var loadTimeout = setTimeout(function(){
    setStatus('WAFlash 引擎加载超时，正在切换到 Ruffle...');
    setTimeout(switchToRuffle, 2000);
}, 15000);

script.onload = function(){
    clearTimeout(loadTimeout);
    console.log('WAFlash: 脚本已加载');

    if(typeof WAFlashFactory === 'undefined'){
        console.log('WAFlash: WAFlashFactory 未定义，切换到 Ruffle');
        switchToRuffle();
        return;
    }

    // 构建 Emscripten Module 配置
    var moduleConfig = {
        // SWF 文件 URL 作为参数传递给 WAFlash
        arguments: swfUrl ? [swfUrl] : [],
        preRun: [],
        postRun: [],
        // WASM 文件路径解析 — 从 flash.local 虚拟域名加载
        locateFile: function(path, prefix){
            return 'https://flash.local/waflash/' + path;
        },
        // 日志输出
        print: function(text){ console.log('WAFLASH> ' + text); },
        printErr: function(text){ console.error('WAFLASH> ' + text); },
        // Canvas 元素
        canvas: canvas,
        // 状态显示元素
        statusElement: statusEl,
        setStatus: function(msg){
            if(msg){
                // 格式化下载进度
                msg = msg.replace(/Downloading data\.\.\. \((\d+)\/(\d+)\)/, function(m, cur, total){
                    return '下载引擎... ' + Math.floor(parseInt(cur)/parseInt(total)*100) + '%';
                });
                console.log('WAFLASH> ' + msg);
                if(msg.indexOf('Loading SWF...') === 0){
                    msg = '正在加载 SWF...';
                }
                statusEl.innerHTML = msg;
                statusEl.style.display = 'block';
            }
        },
        showStatus: showStatus,
        hideStatus: hideStatus,
        unload: function(){},
        // WAFlash HAL 配置
        WAFLASH: {
            hal: {
                url_transformRequestUrl: function(url){
                    // 转换 hangame 资源 URL（如有需要）
                    var idx = url.lastIndexOf('/');
                    if(idx >= 0){
                        var base = url.substr(0, idx + 1);
                        var name = url.substr(idx + 1);
                        if(base === 'http://images.hangame.co.kr/static/flash/flashgame/game/lang/'){
                            return '/assets/hangame/' + name;
                        }
                    }
                    return url;
                }
            }
        }
    };

    // 保存到全局供调试
    window.waflash = moduleConfig;

    // Canvas 事件处理
    canvas.addEventListener('webglcontextlost', function(e){
        console.warn('WAFlash: WebGL context lost');
        e.preventDefault();
    }, false);

    // 防止键盘事件被 canvas 拦截
    canvas.addEventListener('keydown', function(e){
        e.preventDefault();
        e.stopPropagation();
    });

    // 点击 canvas 获取焦点
    var mouseDown = false;
    document.onmousedown = function(e){
        if(e.target === canvas){
            if(!mouseDown){
                canvas.focus();
                mouseDown = true;
            }
        } else {
            mouseDown = false;
        }
    };

    setStatus('正在初始化 WAFlash 引擎...');

    // 初始化 WAFlash 引擎
    WAFlashFactory(moduleConfig).then(function(module){
        console.log('WAFLASH> Waflash module created!');
        hideStatus();

        // 如果没有指定 SWF URL，启用拖放功能
        if(!swfUrl){
            setStatus('拖放 SWF 文件到此处播放');
            enableDragDrop(moduleConfig, module);
        }
    }).catch(function(err){
        console.error('WAFlash 初始化失败:', err);
        setStatus('WAFlash 初始化失败: ' + err);
        setTimeout(switchToRuffle, 3000);
    });
};

script.onerror = function(){
    clearTimeout(loadTimeout);
    console.error('WAFlash: 脚本加载失败');
    setStatus('WAFlash 引擎加载失败，正在切换到 Ruffle...');
    setTimeout(switchToRuffle, 2000);
};

document.head.appendChild(script);

// ---------------------------------------------------------------------------
// 拖放支持（无 SWF URL 时）
// ---------------------------------------------------------------------------
function enableDragDrop(config, module){
    document.addEventListener('dragenter', function(e){ e.preventDefault(); e.stopPropagation(); }, false);
    document.addEventListener('dragleave', function(e){ e.preventDefault(); e.stopPropagation(); }, false);
    document.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); }, false);
    document.addEventListener('drop', function(e){
        e.preventDefault();
        e.stopPropagation();
        if(e.dataTransfer.files.length > 0){
            var file = e.dataTransfer.files[0];
            if(file.size < 268435456){ // 256MB limit
                var reader = new FileReader();
                reader.onload = function(ev){
                    console.log('WAFLASH> file loaded!');
                    var result = ev.target.result;
                    if(result){
                        var data = new Uint8Array(result);
                        var ptr = module._malloc(data.length);
                        module.HEAP8.set(data, ptr);
                        module.ccall('reopenBuffer', 'int',
                            ['string', 'number', 'number'],
                            [file.name, ptr, data.length]);
                        module._free(ptr);
                        hideStatus();
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        }
        hideStatus();
    }, false);
}

// ---------------------------------------------------------------------------
// 回退到 Ruffle 引擎
// ---------------------------------------------------------------------------
function switchToRuffle(){
    var q = '?swf=' + encodeURIComponent(swfUrl) +
            '&quality=' + quality +
            '&autoplay=' + autoplay +
            '&scale=' + scale;
    location.href = 'player.html' + q;
}
</script>
</body>
</html>
