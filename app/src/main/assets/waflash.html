<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WAFlash Player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #canvas{display:block;width:100%;height:100%;background:#000;outline:none}
  #waflashStatus{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:70%;color:#fff;margin:0 auto;padding:20px;font-size:1rem;text-align:center;
    background-color:rgba(0,0,0,0.7);border-radius:8px;z-index:100}
  #switchBtn{margin-top:12px;padding:8px 20px;background:#8A7BFF;color:#fff;
    border:none;border-radius:4px;cursor:pointer;font-size:14px}
  #switchBtn:hover{background:#7A6BEF}
</style>
</head>
<body>
<canvas id="canvas" tabindex="1"></canvas>
<div id="waflashStatus">正在加载 WAFlash 引擎...</div>
<script>
// ---------------------------------------------------------------------------
// URL 参数解析
// ---------------------------------------------------------------------------
var params = new URLSearchParams(location.search);
var swfUrl = params.get('swf') || '';
var quality = params.get('quality') || 'high';
var autoplay = params.get('autoplay') || 'on';
var scale = params.get('scale') || 'showAll';

// ---------------------------------------------------------------------------
// 按键状态管理器（与 player.html 相同）
// ---------------------------------------------------------------------------
window.__gameKeys = (function(){
    var pressed = {};
    function dispatch(type, key, code, keyCode){
        try{
            var ev = new KeyboardEvent(type, {
                key:key, code:code, keyCode:keyCode, which:keyCode,
                bubbles:true, cancelable:true
            });
            document.dispatchEvent(ev);
            window.dispatchEvent(ev);
            if(document.activeElement && document.activeElement !== document.body){
                document.activeElement.dispatchEvent(ev);
            }
        }catch(e){}
    }
    return {
        down: function(keyCode, key, code){
            keyCode = parseInt(keyCode);
            if(pressed[keyCode]) return;
            pressed[keyCode] = {key:key, code:code};
            dispatch('keydown', key, code, keyCode);
        },
        up: function(keyCode, key, code){
            keyCode = parseInt(keyCode);
            if(!pressed[keyCode]) return;
            delete pressed[keyCode];
            dispatch('keyup', key, code, keyCode);
            setTimeout(function(){ dispatch('keyup', key, code, keyCode); }, 50);
            setTimeout(function(){ dispatch('keyup', key, code, keyCode); }, 150);
        },
        releaseAll: function(){
            for(var kc in pressed){
                var info = pressed[kc];
                dispatch('keyup', info.key, info.code, parseInt(kc));
                dispatch('keyup', info.key, info.code, parseInt(kc));
            }
            pressed = {};
        },
        sync: function(androidKeys){
            var androidSet = {};
            androidKeys.forEach(function(kc){ androidSet[kc] = true; });
            for(var kc in pressed){
                if(!androidSet[kc]){
                    var info = pressed[kc];
                    dispatch('keyup', info.key, info.code, parseInt(kc));
                    delete pressed[kc];
                }
            }
        }
    };
})();

window.addEventListener('blur', function(){ window.__gameKeys.releaseAll(); });
document.addEventListener('visibilitychange', function(){
    if(document.hidden) window.__gameKeys.releaseAll();
});

window.__setQuality = function(q){ /* WAFlash 不支持运行时切换画质 */ };

// ---------------------------------------------------------------------------
// WAFlash 引擎加载
// ---------------------------------------------------------------------------
var canvas = document.getElementById('canvas');
var statusEl = document.getElementById('waflashStatus');

// 调整 canvas 尺寸
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Emscripten Module 配置
var Module = {
    canvas: canvas,
    onRuntimeInitialized: function(){
        statusEl.style.display = 'none';
        console.log('WAFLASH> module created!');
        // 加载 SWF
        if(swfUrl && typeof WAFlash !== 'undefined'){
            try{
                WAFlash.loadSwf(swfUrl);
            }catch(e){
                statusEl.style.display = 'block';
                statusEl.innerHTML = 'SWF 加载失败: ' + e;
            }
        }
    },
    print: function(text){ console.log('WAFLASH> ' + text); },
    printErr: function(text){ console.error('WAFLASH> ' + text); }
};

// 尝试加载本地 WAFlash 引擎
var script = document.createElement('script');
script.src = 'waflash/waflash.min.js';
script.async = true;

var loadTimeout = setTimeout(function(){
    showEngineNotFound();
}, 15000);

script.onload = function(){
    clearTimeout(loadTimeout);
    console.log('WAFLASH> engine loaded');
};

script.onerror = function(){
    clearTimeout(loadTimeout);
    showEngineNotFound();
};

function showEngineNotFound(){
    statusEl.style.display = 'block';
    statusEl.innerHTML =
        'WAFlash 引擎文件未找到<br>' +
        '<small style="color:#8899AA">请将 waflash.min.js 添加到 assets/waflash/ 目录</small><br>' +
        '<small style="color:#8899AA">将回退到 Ruffle 引擎</small><br>' +
        '<button id="switchBtn" onclick="switchToRuffle()">切换到 Ruffle 引擎</button>';
}

function switchToRuffle(){
    var q = '?swf=' + encodeURIComponent(swfUrl) +
            '&quality=' + quality +
            '&autoplay=' + autoplay +
            '&scale=' + scale;
    location.href = 'player.html' + q;
}

document.head.appendChild(script);

// 初始化超时
setTimeout(function(){
    if(statusEl.style.display !== 'none' && !statusEl.innerHTML.includes('切换到')){
        showEngineNotFound();
    }
}, 30000);
</script>
</body>
</html>
