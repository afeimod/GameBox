<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  /* Ruffle player 不强制 100%，让引擎内部 letterbox 自适应 */
  ruffle-player { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      // letterbox: "on" 让引擎用 CSS 信箱模式，避免画面截断或超出
      "letterbox": "on",
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      // scale: "showAll" 缩放整个 SWF 以适应容器（保持宽高比）
      "scale": "showAll",
      "quality": "high",
      // 允许全屏（通过 CSS 全屏实现，不使用原生 Fullscreen API 避免卡死）
      "allowFullscreen": true,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        // 不强制 100%，让 Ruffle 内部 letterbox 引擎处理尺寸
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;

        // 隐藏 loading 的函数（防重复调用）
        var loadingHidden = false;
        function hideLoading() {
          if (loadingHidden) return;
          loadingHidden = true;
          var ld = document.getElementById('loading');
          if (ld) ld.style.display = 'none';
        }

        // 监听 Ruffle 加载完成/错误事件
        player.addEventListener('loadeddata', hideLoading);
        player.addEventListener('load', hideLoading);
        player.addEventListener('canplay', hideLoading);
        player.addEventListener('loaderror', function(e) {
          if (loadingHidden) return;
          loadText.textContent = '游戏加载失败: ' + (e && e.detail ? e.detail.error : '未知错误');
          console.error('[Ruffle] loaderror', e);
        });

        player.ruffle().load(opt);
        hideLoading();
        setTimeout(hideLoading, 5000);
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
        var ld = document.getElementById('loading');
        if (ld) ld.style.display = 'none';
      } catch(e) { console.error(e); }
    };

    // 禁用长按选择 / 缩放
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    // === 全屏处理 ===
    // 不阻止 contextmenu（让 Ruffle 菜单可用），但拦截 Fullscreen API 用 CSS 全屏替代
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

    // CSS 全屏：将 player 元素撑满屏幕，避免原生 Fullscreen API 在 WebView 中卡死
    var __cssFullscreen = false;
    var __savedStyles = {};
    function enterCssFullscreen(el) {
      if (__cssFullscreen) return;
      __cssFullscreen = true;
      __savedStyles.position = el.style.position;
      __savedStyles.width = el.style.width;
      __savedStyles.height = el.style.height;
      __savedStyles.zIndex = el.style.zIndex;
      __savedStyles.top = el.style.top;
      __savedStyles.left = el.style.left;
      el.style.position = 'fixed';
      el.style.top = '0';
      el.style.left = '0';
      el.style.width = '100vw';
      el.style.height = '100vh';
      el.style.zIndex = '99999';
      // 隐藏 loading 和 hint 元素
      var ld = document.getElementById('loading'); if (ld) ld.style.display = 'none';
      var ht = document.getElementById('hint'); if (ht) ht.style.display = 'none';
      // 通知 Android 隐藏系统栏
      try { if (window.Android && window.Android.toggleFullscreen) window.Android.toggleFullscreen(); } catch(e) {}
      // 派发 fullscreenchange 事件让 Ruffle 更新菜单状态
      setTimeout(function() {
        document.dispatchEvent(new Event('fullscreenchange'));
      }, 50);
    }
    function exitCssFullscreen(el) {
      if (!__cssFullscreen) return;
      __cssFullscreen = false;
      el.style.position = __savedStyles.position || '';
      el.style.width = __savedStyles.width || '100%';
      el.style.height = __savedStyles.height || '100%';
      el.style.zIndex = __savedStyles.zIndex || '';
      el.style.top = __savedStyles.top || '';
      el.style.left = __savedStyles.left || '';
      // 通知 Android 恢复系统栏
      try { if (window.Android && window.Android.toggleFullscreen) window.Android.toggleFullscreen(); } catch(e) {}
      // 派发 fullscreenchange 事件
      setTimeout(function() {
        document.dispatchEvent(new Event('fullscreenchange'));
      }, 50);
    }

    // 拦截原生 Fullscreen API，用 CSS 全屏替代
    if (Element.prototype.requestFullscreen) {
      Element.prototype.requestFullscreen = function() {
        enterCssFullscreen(this);
        return Promise.resolve();
      };
    }
    if (Element.prototype.webkitRequestFullscreen) {
      Element.prototype.webkitRequestFullscreen = function() {
        enterCssFullscreen(this);
      };
    }
    if (Element.prototype.mozRequestFullScreen) {
      Element.prototype.mozRequestFullScreen = function() {
        enterCssFullscreen(this);
      };
    }
    if (Element.prototype.msRequestFullscreen) {
      Element.prototype.msRequestFullscreen = function() {
        enterCssFullscreen(this);
      };
    }
    // 拦截 exitFullscreen
    if (document.exitFullscreen) {
      var origExit = document.exitFullscreen.bind(document);
      document.exitFullscreen = function() {
        var player = document.querySelector('ruffle-player');
        if (player) exitCssFullscreen(player);
        return Promise.resolve();
      };
    }
    // fullscreenElement 返回值模拟
    Object.defineProperty(document, 'fullscreenElement', {
      get: function() { return __cssFullscreen ? document.querySelector('ruffle-player') : null; },
      configurable: true
    });
    // 监听 ESC 退出 CSS 全屏
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 27 && __cssFullscreen) {
        var player = document.querySelector('ruffle-player');
        if (player) exitCssFullscreen(player);
      }
    });
  </script>
</body>
</html>
