<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  /* 自定义四角布局:由 JS 根据 box query param 动态设置 left/top/right/bottom */
  #stage.box-custom { background: #000; }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');
    // 新增：scale/letterbox/quality/aspect 由 NavHelper 透传过来。
    // 合法值参考 ruffle core/src/config.rs:42-50 (letterbox: off/fullscreen/on) +
    //                 ruffle core/src/display_object/stage.rs:1020-1023 (scale: showAll/noBorder/exactFit/noScale)
    var SCALE_RAW      = param('scale', 'showAll');
    var LETTERBOX_RAW  = param('letterbox', 'fullscreen');
    var QUALITY_RAW    = param('quality', 'high');
    var ASPECT_RAW     = param('aspect', 'auto');
    // 自定义四角布局(0..1 归一化)。空表示不启用,使用默认全屏。
    var BOX_RAW        = param('box', '');

    function normalizeScale(v) {
      return ['showAll', 'noBorder', 'exactFit', 'noScale'].indexOf(v) >= 0 ? v : 'showAll';
    }
    function normalizeLetterbox(v) {
      return ['off', 'fullscreen', 'on'].indexOf(v) >= 0 ? v : 'fullscreen';
    }
    function normalizeQuality(v) {
      return ['low', 'medium', 'high', 'best'].indexOf(v) >= 0 ? v : 'high';
    }
    var SCALE      = normalizeScale(SCALE_RAW);
    var LETTERBOX  = normalizeLetterbox(LETTERBOX_RAW);
    var QUALITY    = normalizeQuality(QUALITY_RAW);

    // 解析 box="l,t,r,b" 归一化值
    function parseBox(s) {
      if (!s) return null;
      var parts = s.split(',');
      if (parts.length !== 4) return null;
      var v = [parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
      if (v.some(function(x){ return isNaN(x); })) return null;
      // 边界保护
      v[0] = Math.max(0, Math.min(1, v[0]));
      v[1] = Math.max(0, Math.min(1, v[1]));
      v[2] = Math.max(0, Math.min(1, v[2]));
      v[3] = Math.max(0, Math.min(1, v[3]));
      if (v[2] <= v[0] + 0.01 || v[3] <= v[1] + 0.01) return null;
      return v;
    }
    var BOX = parseBox(BOX_RAW);

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Hook fetch + XMLHttpRequest 拦截广告 SWF =====
    // 4399 游戏的 Ruffle 实例经常 loadMovie('http://cdn.comment.4399pk.com/control/ad_as2.swf')
    // 这种广告资源一旦 502,Ruffle 内部 "等待子资源" 状态会把主 SWF 永久卡住。
    // shouldInterceptRequest 也会拦截,但 Ruffle 用 fetch 时拿到空 SWF 可能仍报错。
    // 这里在 JS 层直接返回 200 + 空 SWF,Ruffle Loader 看到 Content-Length:0 立即完成,
    // 主 SWF 不被卡死。广告域名清单与 GameWebViewClient.adHosts 保持一致。
    (function(){
      var AD_HOSTS = ['cdn.comment.4399pk.com', 'comment.4399pk.com',
        'googleads.g.doubleclick.net', 'pagead2.googlesyndication.com',
        'ad.4399.com', 'stat.4399.com', 'analytics.4399.com',
        'hijack.4399.com', 'ad-static.4399pk.com', 'pic.4399pk.com'];
      function isAd(u){ for(var i=0;i<AD_HOSTS.length;i++){ if(u.indexOf(AD_HOSTS[i])>=0) return true;} return false; }
      function isAdSwf(u){ return isAd(u) && /\.swf([?#]|$)/i.test(u); }
      // 最小合法 SWF(FWS + 8 字节 header + 空 body)。
      // 0x46 0x57 0x53 = "FWS" (uncompressed),version=8,file_length=8,frame_count=0
      // 关键字段: Ruffle 看到 version=8 + file_length=8 (无 frame 数据) 立即完成,不会等待。
      var EMPTY_SWF = new Uint8Array([0x46,0x57,0x53,0x08,0x00,0x00,0x00,0x08]);
      function emptySwfResponse(){
        return new Response(EMPTY_SWF, {status:200, statusText:'OK',
          headers:{'Content-Type':'application/x-shockwave-flash',
                   'Content-Length':'8'}});
      }
      function emptyResponse(){
        return new Response('', {status:200, statusText:'OK'});
      }
      // hook fetch
      if(!window.__adFetchHooked && window.fetch){
        window.__adFetchHooked = true;
        var origFetch = window.fetch.bind(window);
        window.fetch = function(input, init){
          var u = typeof input === 'string' ? input : (input && input.url ? input.url : '');
          if(u && isAdSwf(u)) return Promise.resolve(emptySwfResponse());
          if(u && isAd(u)) return Promise.resolve(emptyResponse());
          return origFetch(input, init);
        };
      }
      // hook XMLHttpRequest
      if(!window.__adXhrHooked && window.XMLHttpRequest){
        window.__adXhrHooked = true;
        var origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url){
          this.__isAd = url && isAd(url);
          this.__isAdSwf = url && isAdSwf(url);
          return origOpen.apply(this, arguments);
        };
        var origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function(){
          if(this.__isAdSwf){
            // 模拟空 SWF 响应
            Object.defineProperty(this,'readyState',{get:function(){return 4;}});
            Object.defineProperty(this,'status',{get:function(){return 200;}});
            Object.defineProperty(this,'response',{get:function(){return EMPTY_SWF.buffer;}});
            Object.defineProperty(this,'responseText',{get:function(){return '';}});
            Object.defineProperty(this,'responseType',{get:function(){return 'arraybuffer';}});
            var self = this;
            setTimeout(function(){
              try{ self.dispatchEvent(new Event('load')); }catch(e){}
              try{ self.onload && self.onload(); }catch(e){}
            }, 0);
            return;
          }
          if(this.__isAd){
            Object.defineProperty(this,'readyState',{get:function(){return 4;}});
            Object.defineProperty(this,'status',{get:function(){return 200;}});
            Object.defineProperty(this,'response',{get:function(){return '';}});
            Object.defineProperty(this,'responseText',{get:function(){return '';}});
            var self = this;
            setTimeout(function(){
              try{ self.dispatchEvent(new Event('load')); }catch(e){}
              try{ self.onload && self.onload(); }catch(e){}
            }, 0);
            return;
          }
          return origSend.apply(this, arguments);
        };
      }
    })();

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": LETTERBOX,
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": SCALE,
      // 当用户指定具体画面比例时，强制锁定 scale + align，避免 SWF 内部
      // Stage.scaleMode / Stage.align 把外框 letterbox 抵消掉。
      // Ruffle should_letterbox() 要求 scale_mode=ShowAll + align=空（参考
      // ruffle core/src/display_object/stage.rs:469-478），SWF 改任一项都会让黑边消失。
      "forceScale": ASPECT_RAW !== 'auto',
      "forceAlign": ASPECT_RAW !== 'auto',
      "quality": QUALITY,
      // 允许 Ruffle 内部全屏：实际进入全屏走 WebView 的 onShowCustomView 协议
      // （Android 端实现：SwfPlayerScreen.chromeCallback.onShowFullscreen）。
      "allowFullscreen": true,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    // CDN 模式下无本地字体文件，跳过
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        var opt = { url: SWF_URL, allowScriptAccess: true };
        if (BASE_URL) opt.base = BASE_URL;
        player.ruffle().load(opt);
        document.getElementById('loading').style.display = 'none';

        // 应用自定义四角布局 (box="l,t,r,b" 0..1 归一化)。
        // 这让 Ruffle 把 ruffle-player 元素的 clientWidth/Height 视为新 viewport,
        // 内部按 showAll 自动计算 scale,把 SWF 缩放到自定义矩形内并按 viewport 加黑边。
        if (BOX) {
          stage.classList.add('box-custom');
          // 临时解除 #stage 默认的 fixed inset:0,改用 left/top/right/bottom 归一化
          var s = stage.style;
          s.position = 'fixed';
          s.left = (BOX[0] * 100) + '%';
          s.top = (BOX[1] * 100) + '%';
          s.right = ((1 - BOX[2]) * 100) + '%';
          s.bottom = ((1 - BOX[3]) * 100) + '%';
          s.width = 'auto';
          s.height = 'auto';
        }

        // Ruffle 内核初始化完后，外层 CSS 接管外框。
        // ASPECT_RAW 由 GameWebViewClient.buildRuffleAspectRatioScript 处理。
        // 这里只需要确保 stage 不会一直 100% 100%，给外层脚本操作空间。
        if (ASPECT_RAW && ASPECT_RAW !== 'auto') {
          // 触发一个尺寸刷新，让 GameWebViewClient 注入的 setTimeout 一定能拿到
          // ruffle-player 的实际尺寸。
          window.dispatchEvent(new Event('resize'));
        }
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        var opt = { url: url, allowScriptAccess: true };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
